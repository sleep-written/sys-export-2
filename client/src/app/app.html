@let opened = this.openedSidenav();

<mat-toolbar
class="mat-bg-primary">
    <button mat-icon-button
    class="mat-bg-primary mat-text-on-primary"
    (click)="this.openedSidenav.set(!opened)">
        <mat-icon>menu</mat-icon>
    </button>

    <a
    routerLink="/"
    class="mat-text-on-primary">SYS-EXPORT</a>

    <div
    [style.flex]="1">
    </div>

    <app-account #appAccount>
    </app-account>
</mat-toolbar>

<mat-sidenav-container
[hasBackdrop]="true"
(backdropClick)="this.openedSidenav.set(false)">
    <mat-sidenav
    [mode]="'over'"
    [class]="[ 'mat-bg-surface-container-lowest', 'mat-text-on-surface-variant' ]"
    [opened]="opened">
        <app-sidenav-menu
        (navigationChange)="
            this.openedSidenav.set(false);
            appAccount.ngOnInit();
        ">
        </app-sidenav-menu>
    </mat-sidenav>

    <mat-sidenav-content>
        <router-outlet>
        </router-outlet>
    </mat-sidenav-content>
</mat-sidenav-container>
